# inference-perf benchmark config for Llama-3.1-70B-FP8 on G4 (8 GPUs, tensor-parallel).
# Throughput-maximizing operating point: concurrency 512, 4000 requests, ISL/OSL 128/2048.
# At concurrency 512 the server runs at ~99% of peak throughput while keeping end-to-end
# p99 latency (~210s) under inference-perf's default 300s request timeout, so no timeout
# override is needed and no requests are dropped.
load:
  type: concurrent
  stages:
    - concurrency_level: 512
      num_requests: 4000
api:
  type: completion
  streaming: true
server:
  type: vllm
  model_name: nvidia/Llama-3.1-70B-Instruct-FP8
  base_url: http://localhost:8000
  ignore_eos: true
tokenizer:
  pretrained_model_name_or_path: nvidia/Llama-3.1-70B-Instruct-FP8
data:
  type: random
  input_distribution:
    min: 128
    max: 128
    mean: 128
    std_dev: 0
    total_count: 4000
  output_distribution:
    min: 2048
    max: 2048
    mean: 2048
    std_dev: 0
    total_count: 4000
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: false
